name: Verify FlatBuffers fixture provenance
on:
  push:
    branches: [codex/verify-flatbuffers-slsa-20261125]
permissions:
  contents: read

jobs:
  fixtures:
    if: github.repository == 'ievav100/flatbuffers'
    runs-on: windows-2022
    outputs:
      linux-gcc: ${{ steps.hash.outputs.linux-gcc }}
      linux-clang: ${{ steps.hash.outputs.linux-clang }}
      mac-universal: ${{ steps.hash.outputs.mac-universal }}
      mac-intel: ${{ steps.hash.outputs.mac-intel }}
      windows: ${{ steps.hash.outputs.windows }}
    steps:
      - name: Generate five synthetic release archives
        shell: bash
        run: |
          python - <<'PYTHON'
          from zipfile import ZipFile

          names = (
              "Linux.flatc.binary.g++-13.zip",
              "Linux.flatc.binary.clang++-18.zip",
              "Mac.flatc.binary.zip",
              "MacIntel.flatc.binary.zip",
              "Windows.flatc.binary.zip",
          )
          for name in names:
              with ZipFile(name, "w") as archive:
                  archive.writestr(
                      "SYNTHETIC-TEST-FIXTURE.txt",
                      f"FlatBuffers provenance test input only, with no binaries. {name}\n",
                  )
          PYTHON
      - name: Capture native Windows and fixture checksums
        id: hash
        shell: bash
        run: |
          {
            printf 'linux-gcc=%s\n' "$(sha256sum --text Linux.flatc.binary.g++-13.zip | base64 -w0)"
            printf 'linux-clang=%s\n' "$(sha256sum --text Linux.flatc.binary.clang++-18.zip | base64 -w0)"
            printf 'mac-universal=%s\n' "$(sha256sum --text Mac.flatc.binary.zip | base64 -w0)"
            printf 'mac-intel=%s\n' "$(sha256sum --text MacIntel.flatc.binary.zip | base64 -w0)"
            windows_checksum=$(sha256sum Windows.flatc.binary.zip)
            windows_checksum=${windows_checksum%$'\r'}
            test "${windows_checksum#* }" = '*Windows.flatc.binary.zip'
            printf 'windows=%s\n' "$(printf '%s\r\n' "$windows_checksum" | base64 -w0)"
          } >> "$GITHUB_OUTPUT"
      - name: Retain fixture archives
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: flatbuffers-provenance-test-fixtures
          path: '*.zip'
          if-no-files-found: error

  release-digests:
    needs: [fixtures]
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    runs-on: ubuntu-24.04
    steps:
      - name: Run the proposed Merge results script
        id: hash
        env:
          LINUXGCC_DIGESTS: ${{ needs.fixtures.outputs.linux-gcc }}
          LINUXCLANG_DIGESTS: ${{ needs.fixtures.outputs.linux-clang }}
          MAC_DIGESTS: ${{ needs.fixtures.outputs.mac-universal }}
          MACINTEL_DIGESTS: ${{ needs.fixtures.outputs.mac-intel }}
          WINDOWS_DIGESTS: ${{ needs.fixtures.outputs.windows }}
        run: |
          set -euo pipefail
          append_digest() {
            local name=$1 checksum sha256
            checksum=$(printf '%s' "$2" | base64 -d)
            checksum=${checksum%$'\r'}
            sha256=${checksum%% *}
            if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ||
                  ( "$checksum" != "$sha256  $name" &&
                    "$checksum" != "$sha256 *$name" ) ]]; then
              printf '::error::Missing or invalid SHA-256 subject for %s\n' "$name" >&2
              return 1
            fi

            # The SLSA generator expects the filename without the binary-mode marker.
            printf '%s  %s\n' "$sha256" "$name"
          }

          {
            append_digest Linux.flatc.binary.g++-13.zip "$LINUXGCC_DIGESTS"
            append_digest Linux.flatc.binary.clang++-18.zip "$LINUXCLANG_DIGESTS"
            append_digest Mac.flatc.binary.zip "$MAC_DIGESTS"
            append_digest MacIntel.flatc.binary.zip "$MACINTEL_DIGESTS"
            append_digest Windows.flatc.binary.zip "$WINDOWS_DIGESTS"
          } > checksums.txt
          echo "digests=$(cat checksums.txt | base64 -w0)" >> $GITHUB_OUTPUT

  provenance:
    needs: [release-digests]
    permissions:
      actions: read
      id-token: write
      contents: write # The reusable job declares this permission for its disabled upload job.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release-digests.outputs.digests }}"
      upload-assets: false
      provenance-name: fixture-provenance.intoto.jsonl
